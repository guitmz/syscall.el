name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: [29.4, 30.2, 31.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master, 2026-10-12
        with:
          version: ${{ matrix.emacs_version }}
      - name: Byte compile
        run: make compile
      - name: Run ERT suite
        run: make test
      - name: Check trailing whitespace and final newlines
        run: |
          ! git grep -nI '[[:blank:]]$'
          python3 - <<'PY'
          from pathlib import Path
          bad = [str(p) for p in Path('.').rglob('*')
                 if p.is_file() and '.git' not in p.parts
                 and p.suffix in {'.el', '.md', '.yml', '.yaml', '.txt'}
                 and not p.read_bytes().endswith(b'\n')]
          if bad:
              raise SystemExit('Missing final newline: ' + ', '.join(bad))
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master, 2026-10-12
        with:
          version: 31.1
      - name: checkdoc and package-lint
        run: make lint
